name: "[TWRP][berlna] Motorola Edge 2021"
on:
  workflow_dispatch:
env:
  TZ: Asia/Kolkata
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup Environment
        uses: rokibhasansagar/slimhub_actions@main

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 24

      - name: Initializing environment
        run: |
          sudo -E apt-get clean
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install curl libstdc++6 git wget rsync aria2 \
            gperf gcc-multilib g++-multilib libc6-dev x11proto-core-dev \
            libx11-dev lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc bc \
            ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev \
            libsdl1.2-dev libxml2 lzop pngcrush schedtool squashfs-tools \
            imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev
          git config --global user.name "januur"
          git config --global user.email "fazuultree@gmail.com"
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Sync Sources
        run: |
          mkdir -p ~/twrp
          cd ~/twrp
          repo init \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp \
            -b twrp-12.1 \
            --depth=1
          repo sync -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Clone Device Tree and AnyKernel3
        run: |
          cd ~/twrp
          git clone https://github.com/SyberHexen/android_device_motorola_berlna-twrp.git \
            --depth=1 -b twrp-12.1 \
            device/motorola/berlna
          git clone https://github.com/osm0sis/AnyKernel3.git \
            --depth=1 \
            bootable/recovery/installer

      - name: Fix Display Black Screen
        run: |
          cd ~/twrp
          echo "" >> device/motorola/berlna/BoardConfig.mk
          echo "TARGET_RECOVERY_PIXEL_FORMAT := RGBX_8888" >> device/motorola/berlna/BoardConfig.mk
          echo "TARGET_RECOVERY_FORCE_PIXEL_FORMAT := RGBX_8888" >> device/motorola/berlna/BoardConfig.mk
          tail -5 device/motorola/berlna/BoardConfig.mk

      - name: Building TWRP
        run: |
          cd ~/twrp
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export TARGET_PREBUILT_KERNEL=device/motorola/berlna/prebuilt/Image
          lunch twrp_berlna-eng
          mka bootimage -j$(nproc --all)

      - name: Check output
        run: |
          find ~/twrp/out/target/product/berlna/ -name "*.img" 2>/dev/null || echo "No img found"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-berlna
          path: |
            /home/runner/twrp/out/target/product/berlna/boot.img
            /home/runner/twrp/device/motorola/berlna/prebuilt/dtb.img
            /home/runner/twrp/device/motorola/berlna/prebuilt/dtbo.img
